<div class="delete">
    <h4>Confirm delete</h4>
    <p>Are you sure you want to delete the {{ category }} <b><u>{{ name }}</u></b>?</p>
    <div class="confirm-actions">
        <button class="secondary-btn" (click)="onDelete()">Delete</button>
        <button class="common-btn" (click)="onClose()">Cancel</button>
    </div>
</div>
