<div class="job-application-popup">
    <div class="popup-body">
        <div class="popup-header">
            <h2>Apply for {{ jobTitle }}</h2>
            <button (click)="closePopup()"><mat-icon class="close-icon">close</mat-icon></button>
        </div>
        <form [formGroup]="applicationForm" (ngSubmit)="submitApplication()">
            <div class="contact-info">
                <label for="email">Email</label>
                <input type="email" id="email" [value]="email" disabled/>
    
                <label for="phone">Phone</label>
                <input type="tel" id="phone" formControlName="phone" placeholder="Enter 10 digit number" maxlength="10"/>
                
                @if(f['phone'].touched && f['phone'].errors?.['pattern']) {
                    <div class="error-msg">
                        Please enter a valid 10-digit phone number.
                    </div>
                }
                @if(f['phone'].touched && f['phone'].errors?.['required']) {
                    <div class="error-msg">
                        Phone number is required.
                    </div>
                }
            </div>
            <div class="file-upload">
                <label for="profile">Your Cineconnect profile was shared in the form of Resume</label>
            </div>
            <div class="popup-footer">
                <button class="primary-btn" (click)="submitApplication()">Submit</button>
                <button class="common-btn" (click)="closePopup()">Cancel</button>
            </div>
        </form>
    </div>
</div>
