<div class="feed">
    <div class="search">
        <app-search (searchTerm)="onSearchChange($event)"></app-search>
    </div>
    <div class="categories">
        @for(cat of categories; track cat) {
        <button [class.active]="cat === selectedCategory" (click)="selectCategory(cat)">
            {{ cat }}
        </button>
        }
    </div>
    <div class="openings">
        <div class="filters">
            <h2>Filters</h2>
            <label class="custom-select" for="states">
                <select id="states" name="options" [(ngModel)]="selectedState" (change) = "selectState($any($event.target).value)">
                    @for(state of states; track state) {
                        <option [value]="state">
                            {{ state }}
                        </option>
                    }
                </select>
            </label>
            <label class="custom-select" for="roles">
                <select id="roles" name="options" [(ngModel)]="selectedRole" (change) = "selectRole($any($event.target).value)">
                    @for(role of roles; track role) {
                        <option value="{{role}}">
                            {{ role }}
                        </option>
                    }
                </select>
            </label>
            <div class="filter-buttons">
                <button [disabled]="selectedState=='Location' && selectedRole=='Role'" class="applybtn" (click)="applyFilters()">apply</button>
                <button class="clearbtn" (click)="clearFilters()">clear</button>
            </div>
        </div>
        @if(filterData.length === 0) {
            <div class="no-results">
                <p>No Openings</p>
            </div>
        } @else {
            <div class="jobs">
                @for(job of filterData; track job) {
                    <app-jobcard [data]="job"/>
                }
            </div>
        }
        <div class="posts">

        </div>
    </div>
</div>
