<div class="container">
    <div class="content">
        @for(post of posts; track $index) {
            <app-feed-post [post]="post"></app-feed-post>
        }
    </div>
    <div class="notify-section">
        <div class="openings-section">
            <h3>Openings</h3>
            @for(opening of openings; track $index) {
                <div class="opening">
                    <h4>{{ opening.projectName }}</h4>
                    <p>{{ opening.postingTime }}</p>
                </div>
            }
        </div>
        <div class="messages-section">
            <h3>Messages</h3>
            @for(msg of newMessages; track $index) {
                <div class="message">
                    <h4>{{ msg.name }}</h4>
                    <p>{{ msg.unreadCount }}</p>
                </div>
            }
        </div>
    </div>
</div>
