<app-mobile-header></app-mobile-header>
<div class="job-board-container">
  <app-filters-component 
    (filtersChange)="onFiltersChanged($event)"
    ></app-filters-component>
  <div class="job-data">
    @if(filteredJobs.length === 0) {
      <p style="color: gray;">no match found, explore more..!!</p>
    } @else {
      @for(data of filteredJobs; track data.id) {
        <app-jobcard [jobData]="data"></app-jobcard>
      }
    }
  </div>
</div>
