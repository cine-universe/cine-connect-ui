<div class="login-container" [class.mobile-show-login]="isEnabledLogin">
    <div class="app-desc">
        <app-landing-component (enableLogin)="enableLogin($event)"></app-landing-component>
    </div>
    <div class="login-content">
        <div class="form-panel">
            <div class="form-wrapper">
                <h2>CINE CONNECT</h2>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    
                    <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        formControlName="email" 
                        placeholder="director@studio.com"
                        [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                    >
                    @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
                        <span class="error-msg">Valid email is required</span>
                    }
                    </div>

                    <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        formControlName="password" 
                        placeholder="••••••••"
                        [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                    >
                    @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                        <span class="error-msg">Password must be at least 6 characters</span>
                    }
                    </div>

                    <div class="actions">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
                    Login to Dashboard
                    </button>

                </form>
                
                <p class="signup-link">Don't have an account? <a href="#">Apply for Access</a></p>
                <button class="btn-primary" (click)="login('github')">Sign in With Github</button>
            </div>
        </div>
    </div>
</div>
