<div class="container">
    <div class="categories">
        @for(cat of categories; track cat) {
            <button [class.active]="cat === selectedCategory" (click)="selectCategory(cat)">
                {{ cat }}
            </button>
        }
    </div>
    <div class="messages-content">
        <div class="message-list">
            <input type="text" (input)="onSearch($event.target.value)" class="search" placeholder="Search...">
            <app-messagelist
              (messageSelected)="messageSelected($event)"
              [selectedCategory]="selectedCategory"
              [searchQuery]="searchQuery">
            </app-messagelist>
        </div>
        <div class="message-box">
            <app-messagebox [message]="selectedMessage"></app-messagebox>
        </div>
    </div>
</div>
<app-messages-screen></app-messages-screen>
